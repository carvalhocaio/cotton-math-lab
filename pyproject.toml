[project]
name = "cotton-math-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
oracle = [
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests, no external dependency",
    "oracle: validates the implementation against scipy/sklearn/torch",
    "slow: convergence or statistical tests with many samples",
]
addopts = "-q --strict-markers"

[tool.hatch.build.targets.wheel]
packages = ["src/cotton_math_lab"]
